<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MZ 언어 나이 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* Y2K 레트로 펀치 컬러 팔레트 */
            --bg: #F0F4FF;
            --card: #FFFFFF;
            --primary: #FF3D00;
            --secondary: #00E676;
            --accent: #2979FF;
            --text: #1A1A1B;
            --text-muted: #555555;
            --border: #1A1A1B;
            --error: #FF3D00;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            padding-top: env(safe-area-inset-top, 16px);
            padding-bottom: env(safe-area-inset-bottom, 16px);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 420px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card {
            background-color: var(--card);
            border-radius: 16px;
            padding: 28px 20px;
            margin-bottom: 16px;
            border: 3px solid var(--border);
            box-shadow: 6px 6px 0px var(--border);
        }

        h1 {
            font-size: 1.7rem;
            text-align: center;
            margin-bottom: 16px;
            color: var(--primary);
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .description {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .btn-primary {
            width: 100%;
            padding: 18px 24px;
            background: var(--primary);
            border: 3px solid var(--border);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            box-shadow: 4px 4px 0px var(--border);
        }

        .btn-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border);
        }

        .btn-primary:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .btn-primary:focus {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* Quiz Screen */
        .progress-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .progress-text {
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 700;
            min-width: 40px;
        }

        .progress-track {
            flex: 1;
            height: 12px;
            background: #E0E0E0;
            border-radius: 6px;
            margin-left: 12px;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: var(--secondary);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .question-term {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--primary);
            word-break: keep-all;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.08);
        }

        .question-prompt {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 1rem;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.92rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            line-height: 1.5;
            word-break: keep-all;
            box-shadow: 3px 3px 0px var(--border);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: #E3F2FD;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border);
        }

        .option-btn:active:not(:disabled) {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .option-btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            border-color: var(--secondary);
            background: #E8F5E9;
            color: #1B5E20;
            box-shadow: 3px 3px 0px #1B5E20;
        }

        .option-btn.incorrect {
            border-color: var(--error);
            background: #FFEBEE;
            color: #B71C1C;
            box-shadow: 3px 3px 0px #B71C1C;
        }

        .option-btn.show-correct {
            border-color: var(--secondary);
            background: #E8F5E9;
        }

        .btn-next {
            width: 100%;
            padding: 16px 24px;
            background: var(--accent);
            border: 3px solid var(--border);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: none;
            touch-action: manipulation;
            box-shadow: 4px 4px 0px var(--border);
        }

        .btn-next.show {
            display: block;
        }

        .btn-next:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border);
        }

        .btn-next:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .btn-next:focus {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        /* Result Screen */
        .result-age {
            text-align: center;
            margin-bottom: 20px;
        }

        .result-age-label {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-age-number {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1.1;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }

        .result-age-unit {
            font-size: 1.5rem;
            color: var(--text);
            font-weight: 700;
        }

        .result-score {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .result-emoji {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .result-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .result-description {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 24px;
            word-break: keep-all;
        }

        .result-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-share {
            width: 100%;
            padding: 16px 24px;
            background: var(--secondary);
            border: 3px solid var(--border);
            border-radius: 12px;
            color: var(--border);
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            box-shadow: 4px 4px 0px var(--border);
        }

        .btn-share:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border);
        }

        .btn-share:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .btn-share:focus {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-retry {
            width: 100%;
            padding: 16px 24px;
            background: var(--card);
            border: 3px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            box-shadow: 4px 4px 0px var(--border);
        }

        .btn-retry:hover {
            background: #F5F5F5;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border);
        }

        .btn-retry:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .btn-retry:focus {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            border: 2px solid var(--secondary);
            color: #1B5E20;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
            box-shadow: 3px 3px 0px var(--border);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Ad placeholder */
        .ad-placeholder {
            width: 100%;
            max-width: 420px;
            height: 50px;
            margin-top: auto;
        }

        /* Screen visibility */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Small mobile adjustments */
        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 24px 16px;
                border-radius: 14px;
                box-shadow: 5px 5px 0px var(--border);
            }

            h1 {
                font-size: 1.5rem;
            }

            .question-term {
                font-size: 1.8rem;
            }

            .option-btn {
                padding: 12px 14px;
                font-size: 0.87rem;
            }

            .result-age-number {
                font-size: 3.8rem;
            }

            .result-title {
                font-size: 1rem;
            }

            .result-description {
                font-size: 0.85rem;
            }
        }

        /* Very small screens */
        @media (max-width: 320px) {
            .question-term {
                font-size: 1.5rem;
            }

            .result-age-number {
                font-size: 3.2rem;
            }
        }

        /* Landscape mode on mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .card {
                padding: 16px;
            }

            .question-term {
                font-size: 1.5rem;
                margin-bottom: 4px;
            }

            .question-prompt {
                margin-bottom: 12px;
            }

            .options {
                gap: 8px;
            }

            .option-btn {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <div class="card">
                <h1>MZ 언어 나이 테스트</h1>
                <p class="description">
                    요즘 인터넷 유행어와 신조어를<br>
                    얼마나 알고 계신가요?<br><br>
                    8문항 테스트로<br>
                    당신의 언어 나이를 확인해보세요!
                </p>

                <button class="btn-primary" id="startBtn" aria-label="테스트 시작">테스트 시작</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="card">
                <div class="progress-bar">
                    <span class="progress-text" id="progressText">1/8</span>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width: 12.5%"></div>
                    </div>
                </div>

                <div class="question-term" id="questionTerm">손절미</div>
                <p class="question-prompt">이 단어의 뜻은?</p>

                <div class="options" id="optionsContainer" role="group" aria-label="보기">
                </div>

                <button class="btn-next" id="nextBtn" aria-label="다음 문항">다음</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="screen">
            <div class="card">
                <div class="result-age">
                    <p class="result-age-label">당신의 언어 나이는</p>
                    <span class="result-age-number" id="resultAge">25</span>
                    <span class="result-age-unit">세</span>
                </div>

                <p class="result-score" id="resultScore">정답: 6/8</p>

                <div class="result-emoji" id="resultEmoji">🏆</div>
                <p class="result-title" id="resultTitle">결과 문구</p>
                <p class="result-description" id="resultDescription">상세 설명</p>

                <div class="result-buttons">
                    <button class="btn-share" id="shareBtn" aria-label="결과 공유하기">📤 결과 공유하기</button>
                    <button class="btn-retry" id="retryBtn" aria-label="다시하기">🔄 다시하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Ad placeholder (reserved for future use) -->
    <div class="ad-placeholder" aria-hidden="true"></div>

    <!-- Toast notification -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

                maxAge: 32,
                emoji: "🥈",
                title: "트렌드에 민감한 얼리어답터! 웬만한 대화는 막힘없네요.",
                description: "신조어 사용이 아주 자연스러워요. 직장이나 모임에서 '요즘 애들' 말을 찰떡같이 알아듣고 계시군요. 갓생 살 준비가 완벽히 되셨습니다!"
            },
            {
                minRate: 50,
                maxRate: 69,
                minAge: 33,
                maxAge: 44,
                emoji: "🥉",
                title: "아는 만큼 보인다! 딱 적당하게 유행을 즐기는 중.",
                description: "몇몇 단어는 아리송하지만, 대세는 놓치지 않고 있네요. 밥플릭스 하면서 저메추 받는 평범한 현대인의 소양을 충분히 갖추셨습니다."
            },
            {
                minRate: 30,
                maxRate: 49,
                minAge: 45,
                maxAge: 54,
                emoji: "💡",
                title: "조금은 낯설지만 괜찮아요. 이제 하나씩 알아가는 재미!",
                description: "신조어는 외계어 같지만, 맥락으로 파악하는 눈치는 백단이시군요! '스불재' 같은 상황만 피하신다면 소통에는 문제없을 거예요."
            },
            {
                minRate: 0,
                maxRate: 29,
                minAge: 55,
                maxAge: 60,
                emoji: "🍷",
                title: "신조어는 거들 뿐, 인생의 관록은 이미 만렙!",
                description: "밈은 몰라도 인생은 압니다. 유행어에 일희일비하지 않는 당신이 진정한 갓생러! 인생은 60부터, 이제부터 하나씩 배워보면 되죠."
            }
        ];

        // Game state - fixed to 8 questions
        const QUESTION_COUNT = 8;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let correctAnswers = 0;
        let answered = false;

        // DOM Elements
        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');
        const startBtn = document.getElementById('startBtn');
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const questionTerm = document.getElementById('questionTerm');
        const optionsContainer = document.getElementById('optionsContainer');
        const nextBtn = document.getElementById('nextBtn');
        const resultAge = document.getElementById('resultAge');
        const resultScore = document.getElementById('resultScore');
        const resultEmoji = document.getElementById('resultEmoji');
        const resultTitle = document.getElementById('resultTitle');
        const resultDescription = document.getElementById('resultDescription');
        const shareBtn = document.getElementById('shareBtn');
        const retryBtn = document.getElementById('retryBtn');
        const toast = document.getElementById('toast');

        // Utility functions
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function showScreen(screen) {
            startScreen.classList.remove('active');
            quizScreen.classList.remove('active');
            resultScreen.classList.remove('active');
            screen.classList.add('active');
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Start game
        startBtn.addEventListener('click', () => {
            startGame();
        });

        function startGame() {
            // Reset state
            currentQuestionIndex = 0;
            correctAnswers = 0;
            answered = false;

            // Select random 8 questions from pool
            currentQuestions = shuffleArray(QUESTION_POOL).slice(0, QUESTION_COUNT);

            // Show quiz screen
            showScreen(quizScreen);
            displayQuestion();
        }

        function displayQuestion() {
            const question = currentQuestions[currentQuestionIndex];

            // Update progress
            progressText.textContent = `${currentQuestionIndex + 1}/${QUESTION_COUNT}`;
            progressFill.style.width = `${((currentQuestionIndex + 1) / QUESTION_COUNT) * 100}%`;

            // Display term
            questionTerm.textContent = question.term;

            // Generate shuffled options from predefined correct/wrong answers
            const options = shuffleArray([question.correct, question.wrong1, question.wrong2]);

            // Clear and populate options
            optionsContainer.innerHTML = '';
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.setAttribute('aria-label', `보기 ${index + 1}: ${option}`);
                btn.dataset.correct = option === question.correct;
                btn.addEventListener('click', () => selectOption(btn, option === question.correct));
                optionsContainer.appendChild(btn);
            });

            // Reset state
            answered = false;
            nextBtn.classList.remove('show');
        }

        function selectOption(selectedBtn, isCorrect) {
            if (answered) return;
            answered = true;

            // Disable all options
            const allOptions = optionsContainer.querySelectorAll('.option-btn');
            allOptions.forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.correct === 'true') {
                    btn.classList.add('show-correct');
                }
            });

            // Mark selected option
            if (isCorrect) {
                selectedBtn.classList.remove('show-correct');
                selectedBtn.classList.add('correct');
                correctAnswers++;
            } else {
                selectedBtn.classList.add('incorrect');
            }

            // Show next button
            nextBtn.classList.add('show');
            nextBtn.textContent = currentQuestionIndex === QUESTION_COUNT - 1 ? '결과 보기' : '다음';
        }

        // Next button
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex >= QUESTION_COUNT) {
                showResult();
            } else {
                displayQuestion();
            }
        });

        function showResult() {
            // Calculate rate
            const rate = (correctAnswers / QUESTION_COUNT) * 100;

            // Find tier
            const tier = RESULT_TIERS.find(t => rate >= t.minRate && rate <= t.maxRate) || RESULT_TIERS[RESULT_TIERS.length - 1];

            // Calculate age within tier range
            let age;
            if (rate >= tier.minRate && rate <= tier.maxRate) {
                const tierRateRange = tier.maxRate - tier.minRate;
                const tierAgeRange = tier.maxAge - tier.minAge;
                const ratePosition = (tier.maxRate - rate) / tierRateRange;
                age = Math.round(tier.minAge + (ratePosition * tierAgeRange));
            } else {
                age = tier.minAge;
            }

            // Clamp age
            age = Math.max(tier.minAge, Math.min(tier.maxAge, age));

            // Update result screen
            resultAge.textContent = age;
            resultScore.textContent = `정답: ${correctAnswers}/${QUESTION_COUNT}`;
            resultEmoji.textContent = tier.emoji;
            resultTitle.textContent = tier.title;
            resultDescription.textContent = tier.description;

            showScreen(resultScreen);
        }

        // Share button
        shareBtn.addEventListener('click', async () => {
            const age = resultAge.textContent;
            const shareText = `[신조어 나이 테스트 결과] 내 언어 나이는… ${age}세 😎 갓생 살기 참 힘들다 그치? 당신의 언어 점수는 ${correctAnswers}/${QUESTION_COUNT}점! 지금 바로 확인해봐! #신조어테스트 #언어나이 #MZ능력시험 #갓생러`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'MZ 언어 나이 테스트',
                        text: shareText
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        copyToClipboard(shareText);
                    }
                }
            } else {
                copyToClipboard(shareText);
            }
        });

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 결과가 클립보드에 복사되었습니다!');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('📋 결과가 클립보드에 복사되었습니다!');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // Retry button - restart with new random questions
        retryBtn.addEventListener('click', () => {
            startGame();
        });
    </script>
</body>
</html>
